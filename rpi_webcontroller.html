<!DOCTYPE HTML>
    <html>
        <head>
            <title> rpi_wedstrijdklok </title>

            <meta http-equiv="content-type" content="text/html; charset=UTF-8">
            <meta name="apple-mobile-web-app-capable" content="yes" />
            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
            
        </head>
        <script src="/static/jquery.min.js"></script>
        <body bgcolor = "#F3F4F6"> 
            <hr/><hr>
            <h1 style="color : #1F2937;"><center> RPi Wedstrijdklok Web Interface </center></h1>
            <h2><center><p>{{time}}</p></center></h2>
            <hr/><hr>
            
            <h2> API Keys </h2>
            
            <center> <input type="text" id="inputLSkey" style="width: 500px;" placeholder="Enter API key last start here...">
            <button id="sendLSkey">Send</button> </center>
            <center> <input type="text" id="inputHFkey" style="width: 500px;" placeholder="Enter API key heat finished here...">
            <button id="sendHFkey">Send</button> </center>
            <center> <input type="text" id="inputNSkey" style="width: 500px;" placeholder="Enter API key next start here...">
            <button id="sendNSkey">Send</button> </center>
            
            <center> Current API keys </center> 
            <center> <label for="currentLSkey"> Last start: </label> <span id="currentLSkey">--</span></center>
            <center> <label for="currentHFkey">Heat finished: </label> <span id="currentHFkey">--</span></center>
            <center> <label for="currentNSkey">Next start: </label> <span id="currentNSkey">--</span></center>
            <center> <label for="getkeys">Show current API keys: </label> <button style="margin-left: 10px;" id="getkeys">&#x21C4;</button></center>
            
            <h2> Manual controls </h2>
            <center style="margin-bottom: 10px;"> <label for="resetclock">Reset clock to show current time: </label> <button id="resetclock">&#8635;</button></center>
            <center style="margin-bottom: 10px;"> <label for="toggle10sec">Toggle 10 sec countdown: </label> <button id="toggle10sec">10s</button></center>
            <center> <label for="timeuser">Count from this time: </label> <input type="time" id="timeuser" step="1"><button id="senduserup">Count up</button><button id="senduserdown">Count down</button></button></center>
            
            <h2> API controls </h2>
            <center> Received API times: </center>
            <center> <label for="currentLStime"> Last start: </label> <span id="currentLStime">--</span></center>
            <center> <label for="currentHFbool">Heat finished: </label> <span id="currentHFbool">--</span></center>
            <center> <label for="currentNStime">Next start: </label> <span id="currentNStime">--</span></center>
            <center> <label for="getAPIdata">Fetch API data: </label> <button style="margin-left: 10px;" id="getAPIdata">&#x21C4;</button></center>
            <center> <label for="setAPIdata">Count based on API data: </label> <button style="margin-left: 10px;" id="setAPIdata">&#x2713;</button></center>
            <center> <label for="APIfetcherror">Error: </label> <span id="APIfetcherror">--</span></center>
            
            <script>
                  // API keys
                  document.getElementById("sendLSkey").addEventListener("click",function() {
                        var text = document.getElementById("inputLSkey").value;
                        $.getJSON("/sendLSkey",{text:text}, function(data) {
                              console.log(data);
                        });
                  });
                  document.getElementById("sendHFkey").addEventListener("click",function() {
                        var text = document.getElementById("inputHFkey").value;
                        $.getJSON("/sendHFkey",{text:text}, function(data) {
                              console.log(data);
                        });
                  });
                  document.getElementById("sendNSkey").addEventListener("click",function() {
                        var text = document.getElementById("inputNSkey").value;
                        $.getJSON("/sendNSkey",{text:text}, function(data) {
                              console.log(data);
                        });
                  });
                  document.getElementById("getkeys").addEventListener("click",function() {
                        fetch("/getkeys")
                              .then(function(response) {
                                    return response.json();
                              })
                              .then(function(data) {
                                    console.log(data);
                                    document.getElementById("currentLSkey").textContent = data.text1;
                                    document.getElementById("currentHFkey").textContent = data.text2;
                                    document.getElementById("currentNSkey").textContent = data.text3;
                              });
                  });
                  // Manual controls
                  // Reset clock
                  document.getElementById("resetclock").addEventListener("click",function() {
                        $.getJSON("/resetclock", function(data) {
                              console.log(data);
                        });
                  });
                  // Toggle 10s
                  document.getElementById("toggle10sec").addEventListener("click",function() {
                        $.getJSON("/toggle10sec", function(data) {
                              console.log(data);
                        });
                  });
                  // Display time directly
                  document.getElementById("senduserup").addEventListener("click",function() {
                        var time = document.getElementById("timeuser").value;
                        $.getJSON("/senduserup",{time:time}, function(data) {
                              console.log(data);
                        });
                  });
                  document.getElementById("senduserdown").addEventListener("click",function() {
                        var time = document.getElementById("timeuser").value;
                        $.getJSON("/senduserdown",{time:time}, function(data) {
                              console.log(data);
                        });
                  });
                  // API Controls
                  document.getElementById("getAPIdata").addEventListener("click",function() {
                        fetch("/getAPIdata")
                              .then(function(response) {
                                    return response.json();
                              })
                              .then(function(data) {
                                    console.log(data);
                                    document.getElementById("currentLStime").textContent = data.text1;
                                    document.getElementById("currentHFbool").textContent = data.text2;
                                    document.getElementById("currentNStime").textContent = data.text3;
                                    document.getElementById("APIfetcherror").textContent = data.text4;
                              });
                  });
                  document.getElementById("setAPIdata").addEventListener("click",function() {
                        $.getJSON("/setAPIdata", function(data) {
                              console.log(data);
                        });
                  });
            </script>
    </body>
</html>
