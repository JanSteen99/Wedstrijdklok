<!DOCTYPE HTML>
    <html>
        <head>
            <title> rpi_wedstrijdklok </title>

            <meta http-equiv="content-type" content="text/html; charset=UTF-8">
            <meta name="apple-mobile-web-app-capable" content="yes" />
            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
            
        </head>
        <script src="/static/jquery.min.js"></script>
        <body bgcolor = "#F3F4F6"> 
            <hr/><hr>
            <h1 style="color : #1F2937;"><center> RPi Wedstrijdklok Web Interface </center></h1>
            <hr/><hr>
            
            <h2> API Keys </h2>
            
            <center> <input type="text" id="sendeventidinput" style="width: 500px;" placeholder="Enter custom event id here ...">
            <button id="sendeventidbutton">Send</button> </center>
            <center> <input type="text" id="sendAPIkeyinput" style="width: 500px;" placeholder="Enter custom API key here...">
            <button id="sendAPIkeybutton">Send</button> </center>
            
            <center> Current event id and API key </center> 
            <center> <label for="currenteventidbox"> Event id: </label> <span id="currenteventidbox">--</span></center>
            <center> <label for="currentAPIkeybox">API key: </label> <span id="currentAPIkeybox">--</span></center>
            <center> <label for="showkeyidbutton">Display current id and key: </label> <button style="margin-left: 10px;" id="showkeyidbutton">&#x21C4;</button></center>
            <center> <label for="fetchkeyidbutton">Fetch new id and key: </label> <button style="margin-left: 10px;" id="fetchkeyidbutton">&#x21C4;</button></center>
            
            <h2> Manual controls </h2>
            <center style="margin-bottom: 10px;"> <label for="resetclock">Reset clock to show current time: </label> <button id="resetclock">&#8635;</button></center>
            <center style="margin-bottom: 10px;"> <label for="toggle10sec">Toggle 10 sec countdown: </label> <button id="toggle10sec">10s</button></center>
            <center> <label for="timeuser">Count from this time: </label> <input type="time" id="timeuser" step="1"><button id="senduserup">Count up</button><button id="senduserdown">Count down</button></button></center>
            
            <h2> API controls </h2>
            <center> <label> <input type="checkbox" id="autoAPIupdatecheckbox"> Update clock automatically with API</label> </center>
            <center> Current API data: </center>
            <center> <label for="currentHFbool">Heat finished: </label> <span id="currentHFbool">--</span></center>
            <center> <label for="currentHCUtime">Heat count up: </label> <span id="currentHCUtime">--</span></center>
            <center> <label for="currentHCDtime">Heat count down: </label> <span id="currentHCDtime">--</span></center>
            <center> <label for="getAPIdata">Display API data: </label> <button style="margin-left: 10px;" id="getAPIdata">&#x21C4;</button></center>
            <center> <label for="setAPIdata">Update clock with API data now: </label> <button style="margin-left: 10px;" id="setAPIdata">&#x2713;</button></center>
            
            <script>
                  // API keys
                  document.getElementById("sendeventidbutton").addEventListener("click",function() {
                        var text = document.getElementById("sendeventidinput").value;
                        $.getJSON("/sendeventid",{text:text}, function(data) {
                              console.log(data);
                        });
                  });
                  document.getElementById("sendAPIkeybutton").addEventListener("click",function() {
                        var text = document.getElementById("sendAPIkeyinput").value;
                        $.getJSON("/sendAPIkey",{text:text}, function(data) {
                              console.log(data);
                        });
                  });
                  document.getElementById("showkeyidbutton").addEventListener("click",function() {
                        fetch("/showkeyid")
                              .then(function(response) {
                                    return response.json();
                              })
                              .then(function(data) {
                                    console.log(data);
                                    document.getElementById("currenteventidbox").textContent = data.text1;
                                    document.getElementById("currentAPIkeybox").textContent = data.text2
                              });
                  });
                  document.getElementById("fetchkeyidbutton").addEventListener("click",function() {
                        fetch("/fetchkeyid")
                  });
                  
                  // Manual controls
                  // Reset clock
                  document.getElementById("resetclock").addEventListener("click",function() {
                        $.getJSON("/resetclock", function(data) {
                              console.log(data);
                        });
                  });
                  // Toggle 10s
                  document.getElementById("toggle10sec").addEventListener("click",function() {
                        $.getJSON("/toggle10sec", function(data) {
                              console.log(data);
                        });
                  });
                  // Display time directly
                  document.getElementById("senduserup").addEventListener("click",function() {
                        var time = document.getElementById("timeuser").value;
                        $.getJSON("/senduserup",{time:time}, function(data) {
                              console.log(data);
                        });
                  });
                  document.getElementById("senduserdown").addEventListener("click",function() {
                        var time = document.getElementById("timeuser").value;
                        $.getJSON("/senduserdown",{time:time}, function(data) {
                              console.log(data);
                        });
                  });
                  // API Controls
                  
                  document.getElementById("autoAPIupdatecheckbox").addEventListener("change", function() {
                      var checked = this.checked;

                      $.getJSON("/autoAPIupdate", {checked: checked}, function(data) {
                          console.log(data);
                      });
                  });

                  document.getElementById("getAPIdata").addEventListener("click",function() {
                        fetch("/getAPIdata")
                              .then(function(response) {
                                    return response.json();
                              })
                              .then(function(data) {
                                    console.log(data);
                                    document.getElementById("currentHFbool").textContent = data.text1;
                                    document.getElementById("currentHCUtime").textContent = data.text2;
                                    document.getElementById("currentHCDtime").textContent = data.text3
                              });
                  });
                  document.getElementById("setAPIdata").addEventListener("click",function() {
                        $.getJSON("/setAPIdata", function(data) {
                              console.log(data);
                        });
                  });
            </script>
    </body>
</html>
